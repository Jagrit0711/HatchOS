<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <!-- CRITICAL: viewport for mobile -->
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover" />
  
  <title>HatchOS Messaging</title>
  
  <!-- PWA Meta Tags - THESE MAKE IT A REAL APP! -->
  <meta name="description" content="HatchOS Messaging - Real-time chat application" />
  <meta name="theme-color" content="#075E54" />
  
  <!-- iOS Web App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HatchOS Messaging" />
  
  <!-- Android Web App Support -->
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- CRITICAL: Link to manifest for standalone mode -->
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icon-192.svg" />
  <link rel="shortcut icon" href="/icon-192.svg" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Site Icon -->
  <link rel="icon" type="image/svg+xml" href="/site-icon.svg" sizes="any" />
  
  <style>
    * {
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #075E54;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root {
      display: flex;
      flex-direction: column;
    }
    /* Loading spinner */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background-color: #075E54;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('SW registration failed:', error);
          });
      });
    }
    
    // Detect if installed as PWA
    if (window.matchMedia('(display-mode: standalone)').matches) {
      console.log('Running as standalone PWA! ✅');
    } else {
      console.log('Running in browser - install as PWA for standalone mode');
    }
  </script>
</body>
</html>
